[project]
name = "backend"
version = "0.1.0"
description = "TMS Fletes - backend Django"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.7",
    "django-ninja>=1.6.2",
    "openrouteservice>=2.3.3",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.7",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.12.8",
]


[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["openrouteservice.*", "decouple.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "core.settings"


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "TID",
    "DJ",
    "S",
    "ASYNC",
    "G",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "I001"]
# S105/S106: los tests de auth necesitan contraseñas literales.
"*/tests/*" = ["S101", "S105", "S106"]
"conftest.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"


[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["test_*.py"]
addopts = "--reuse-db --strict-markers -ra"
filterwarnings = ["error::RuntimeWarning"]
