upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Más específico que /api/: nginx lo elige sin depender del orden.
    location /api/static/ {
        alias /var/www/api-static/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /api/ {
        proxy_pass http://api_upstream/api/;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://api_upstream/admin/;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Sin esto un deploy nuevo queda invisible detrás del bundle viejo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Un deep link a /ordenes-servicio no es un archivo.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
